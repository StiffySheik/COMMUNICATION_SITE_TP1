<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="News – Citoyens en action">Nouvelles – Citoyens en action</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="news">
  <a class="skip-link" href="#contenu" data-en="Skip to main content">Aller au contenu principal</a>
  <header id="site-header" class="site-header"></header>

  <main id="contenu" tabindex="-1">
    <section class="page-head">
      <div class="wrap">
        <h1 data-en="Articles and news">Articles et nouvelles</h1>
        <p class="lead" data-en="The latest from Citoyens en action and civic initiatives in the region.">Les dernières nouvelles de Citoyens en action et des initiatives citoyennes de la région.</p>
      </div>
    </section>
    <section class="section section-white news-full">
      <div class="wrap" data-render="news" data-count="all" data-heading="2"></div>
    </section>
    <section class="section" id="infolettre" aria-labelledby="nl-title">
      <div class="wrap">
        <div class="newsletter">
          <div>
            <h2 id="nl-title" data-en="The monthly newsletter">L'infolettre du mois</h2>
            <p data-key="home_newsletter" data-en="Once a month: civic initiatives in the region and upcoming activities. No advertising.">Une fois par mois, les initiatives citoyennes de la région et les activités à venir. Pas de publicité.</p>
          </div>
          <form class="inline-form" data-proto data-success="Merci! Vous recevrez la prochaine infolettre." data-success-en="Thank you! You'll receive the next newsletter.">
            <div class="field">
              <label for="nl-email"><span data-en="Email address">Adresse courriel</span> <span class="req" aria-hidden="true">*</span></label>
              <input type="email" id="nl-email" name="email" autocomplete="email" required>
            </div>
            <button class="btn" type="submit" data-en="Subscribe">S'abonner</button>
            <p class="form-status" role="status" tabindex="-1"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
