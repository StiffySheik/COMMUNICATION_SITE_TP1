<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Activities – Citoyens en action">Activités – Citoyens en action</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="activities">
  <a class="skip-link" href="#contenu" data-en="Skip to main content">Aller au contenu principal</a>
  <header id="site-header" class="site-header"></header>

  <main id="contenu" tabindex="-1">
    <section class="page-head">
      <div class="wrap">
        <h1 data-en="Upcoming activities">Activités à venir</h1>
        <p class="lead" data-en="Volunteering, workshops, gatherings and campaigns. All our activities are free and open to everyone.">Bénévolat, ateliers, rencontres et campagnes. Toutes nos activités sont gratuites et ouvertes à tous.</p>
      </div>
    </section>
    <section class="section" aria-labelledby="cal-section-title">
      <div class="wrap">
        <h2 id="cal-section-title" data-en="Activity calendar">Calendrier des activités</h2>
        <div class="filters">
          <div class="field">
            <label for="cat-filter" data-en="Show">Afficher</label>
            <select id="cat-filter"></select>
          </div>
        </div>
        <div class="cal-wrap" data-render="calendar"></div>
      </div>
    </section>
    <section class="section section-white" aria-labelledby="list-title">
      <div class="wrap">
        <h2 id="list-title" data-en="All upcoming activities">Toutes les activités à venir</h2>
        <div data-render="upcoming" data-count="all" data-heading="3" data-filter></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
